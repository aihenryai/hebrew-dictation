name: Release

# Builds and signs the Windows and macOS bundles and attaches them to a GitHub
# Release, including the `latest.json` the in-app updater reads.
#
# Two ways in:
#   - push a `v*` tag  -> builds that tag
#   - Run workflow     -> builds a tag that already exists (used to add a
#                         missing platform to a release that already shipped)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build. Leave EMPTY to test-build the current main without releasing anything.'
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # DO NOT raise this. Each matrix job finishes by downloading the
      # release's current `latest.json`, merging its own platform into it, and
      # re-uploading. That is a read-modify-write against one shared file, so
      # two jobs finishing together would each merge into the same pre-merge
      # copy and the second upload would silently drop the first platform —
      # producing a release whose updater only serves one OS. Running the
      # matrix serially is what makes the merge safe.
      max-parallel: 1
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            rust-target: ''
          # macos-latest is Apple Silicon; the target is named explicitly so a
          # future runner-image change cannot silently start producing x86_64
          # bundles under an `-aarch64` filename.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Release path: tag given -> build, sign, and publish to that tag.
      - uses: tauri-apps/tauri-action@v1
        if: inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still produces
          # an installer but no `.sig`, and the in-app updater rejects the
          # release — a silent-looking success that breaks auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password, but the variable must still be set: Tauri
          # prompts interactively when it is absent, which hangs a CI run until
          # it times out rather than failing with a useful message.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Tauri names bundles after the product name, which here is Hebrew
          # ("הכתבה בעברית_2.13.0_x64-setup.exe"). A non-ASCII asset name gets
          # percent-encoded in the GitHub asset URL, which breaks the download
          # link recorded in `latest.json`. This pattern forces ASCII names.
          releaseAssetNamePattern: 'hebrew-dictation-v[version]-[arch][ext]'

      # tauri-action records API asset URLs in latest.json, which the updater
      # cannot download on a public repo (it gets JSON metadata instead of the
      # installer). There is no action input to change that, so rewrite them
      # here. See .github/scripts/fix_updater_urls.py for the full reasoning.
      - name: Point latest.json at public download URLs
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets' > assets.json
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name=="latest.json") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > latest.json
          python .github/scripts/fix_updater_urls.py latest.json assets.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      # Dry-run path: no tag -> compile only, publish nothing. This exists
      # because the release path checks out the TAG, so a fix sitting on main
      # cannot be verified by re-running a release — the run would rebuild the
      # old code and fail identically, which is exactly what happened while
      # setting this up.
      #
      # The signing key IS provided here. Omitting it looks safer but simply
      # breaks the build: tauri.conf.json carries an updater `pubkey`, and
      # Tauri refuses to bundle when it finds a public key with no private one
      # ("A public key has been found, but no private key"). Nothing is
      # published on this path regardless, because no tagName is passed — that,
      # not the absence of a key, is what keeps a dry run from shipping.
      - uses: tauri-apps/tauri-action@v1
        if: inputs.tag == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: ${{ matrix.args }}
